<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael Quirk · Lawyer</title>
<meta name="description" content="Michael Quirk, Lawyer, Brisbane. Contact details and LinkedIn.">
<link rel="icon" href="logo.png">
<style>
  :root{
    --navy:#1F3A5F; --gold:#C68A12; --grey:#595959; --bg:#ffffff; --line:#e6e6e6;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --navy:#dbe6f5; --gold:#e3a93a; --grey:#b3b3b3; --bg:#101a28; --line:#243448; }
  }
  :root[data-theme="dark"]{ --navy:#dbe6f5; --gold:#e3a93a; --grey:#b3b3b3; --bg:#101a28; --line:#243448; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--grey);font:16px/1.6 Aptos,"Segoe UI",Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  main{display:flex;gap:32px;align-items:flex-start;padding:48px 20px;max-width:640px;width:100%}
  .logo{width:76px;height:76px;border-radius:6px;flex:none}
  h1{margin:0;color:var(--navy);font-size:2rem;font-weight:700;line-height:1.15;letter-spacing:-.01em}
  .title{margin:4px 0 20px;color:var(--gold);font-size:1rem;letter-spacing:.04em;text-transform:uppercase}
  ul{list-style:none;margin:0;padding:0;font-size:.95rem}
  li{margin:4px 0}
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}
  .rule{width:48px;height:2px;background:var(--gold);margin:0 0 18px}
  @media (max-width:520px){main{flex-direction:column;gap:20px;align-items:center;text-align:center}.rule{margin:0 auto 18px}}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Michael Quirk logo" width="76" height="76">
  <div>
    <h1>Michael Quirk</h1>
    <p class="title">Lawyer</p>
    <div class="rule"></div>
    <ul>
      <li><a href="tel:+61468349955">+61 468 349 955</a></li>
      <li><a href="mailto:michaeldquirk@gmail.com">michaeldquirk@gmail.com</a></li>
      <li>Mount Gravatt East QLD 4122</li>
      <li><a href="https://linkedin.com/in/mdquirk">linkedin.com/in/mdquirk</a></li>
    </ul>
  </div>
</main>
</body>
</html>
